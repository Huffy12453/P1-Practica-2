<!DOCTYPE html>
<html lang="en">
<!-- basicamente define el idioma -->

<head>
    <meta charset="UTF-8">
    <!-- Esto permite que los acentos y la ñ se puedan ingresar a el html -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Sirve para ajustar la pagina dependiendo del dipositivo donde se este viendo -->
    <title>Enlaces en HTML</title>
    <!-- Este es el titulo de la pagina web -->
</head>
<body>
    <h2>Tipos de enlaces en HTML</h2>
    <p><strong>Enlaces/Hipervinculos a otra pagina del
         mismo sitio.
    </strong></p>
    <a href="1. Hola_mundo.html">1. Hola Mundo</a><br>
    <!-- En este href, te manda a otro html que este conectado en la misma carpeta -->
    <a href="2. Encabezados.html" target="_self">
        2. Encabezados</a><br>
    <a href="3. Parrafos.html" target="_blank">
        3. Parrafos</a><br>
    <a href="4. Salto de linea.html" target="_parent">
        4. Salto de linea</a><br>
    <a href="5. Enfatizado.html" target="_top">
        5. Enfatizado</a><br>
    <p><strong>Enlaces/Hipervinculos a sitios externos
    </strong></p>
    <a href="https://www.google.com/">Google</a><br>
        <!-- Aqui, la palabra Google, se vuelve un tipo boton para mandarte a su pagina-->
    <a href="https://www.youtube.com/" target="_self">
        YouTube</a><br>
        <!-- Aqui el self hace que se habra la pagina web en la misma pestaña. -->
    <a href="https://www.facebook.com/" target="_blank">
        FaceBook</a><br>
        <!-- _blank una propiedad de HTML que se usa en los enlaces para abrir una página web en una pestaña o ventana nueva -->
    <a href="https://www.wikipedia.com/" target="_parent">
        WikiPedia</a><br>
        <!-- _parent sirve para abrir un enlace o cargar el resultado de un formulario en el marco (iframe) o contexto de navegación inmediatamente superior (el padre) del que contiene el elemento actual-->
    <a href="https://www.espanol.yahoo.com/" target="_top">
        Yahoo!</a><br>
         <!-- _top abre el documento enlazado en la ventana o pestaña completa, eliminando cualquier estructura de marcos (frames o iframes) previa -->
</body>
</html>
