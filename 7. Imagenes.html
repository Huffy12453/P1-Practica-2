<!DOCTYPE html>
<html lang="en">
<!-- basicamente define el idioma -->

<head>
    <meta charset="UTF-8">
    <!-- Esto permite que los acentos y la ñ se puedan ingresar a el html -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Sirve para ajustar la pagina dependiendo del dipositivo donde se este viendo -->
    <title>Imagenes en HTML</title>
    <!-- Este es el titulo de la pagina web -->
</head>
<body>
    <h2>Imagenes en HTML</h2>
    <h3>Locales</h3>
    <img src="caritas.png" alt="Imagen de carita feliz">
    <!-- Aqui se busca el png desde la misma carpeta, y si no se encuentra se pondra el alt. -->
    <h3>Locales redismensionado</h3>
    <img src="imagenes/carita.png" alt="" width="200" height="100">
    <!-- Wl width y heigth ayudan a cambiar el tamaño de la imagen. -->
    <h3>Desde internet</h3>
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" width="200" height="200"alt="">
    <!-- Tambien puedes usar links de imagenes desde google o alguna pagina.-->
    <h3>Animaciones</h3>
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" width="200" height="200"alt="">
</body>
</html>
