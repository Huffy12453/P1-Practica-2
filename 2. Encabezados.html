<!DOCTYPE html>
<html lang="en">
<!-- basicamente define el idioma -->

<head>
    <meta charset="UTF-8">
    <!-- Esto permite que los acentos y la ñ se puedan ingresar a el html -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Sirve para ajustar la pagina dependiendo del dipositivo donde se este viendo -->
    <title>Encabezados HTML</title>
    <!-- Este es el titulo del html -->
</head>

<body>
    <!-- Encabezados -->
    <!-- Se definen con la etiqueta h, seguido
  del numero correspondiente de tamaño y/o
  importancia -->
    <h1>Titulo 1</h1>
    <h2>Titulo 2</h2>
    <h3>Titulo 3</h3>
    <h4>Titulo 4</h4>
    <h5>Titulo 5</h5>
    <h6>Titulo 6</h6>
</body>

</html>
